<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"> <!-- Кодировка страницы -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title> <!-- Заголовок -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body> <!-- Тело страницы -->
<div class="row">
    <div class="col-2"> <!-- Меню -->
        <div class="row">
            <div data-bs-theme="dark">
            <div class="card bg-dark" style="max-width: 16rem; height: 950px;">
                <div class="h4 pb-2 mb-2 text-light border-bottom border-light">
                    Меню
                </div>
                <div class="list-group">
                    <a href="home.html" class="list-group-item list-group-item-action text-light bg-dark" >
                        Главная
                    </a>
                    <a href="category.html" class="list-group-item list-group-item-action text-light bg-dark">Категории</a>
                    <a href="catalog.html" class="list-group-item list-group-item-action text-light bg-dark">Каталог</a>
                    <a href="contacts.html" class="list-group-item list-group-item-action active" aria-current="true">Контакты</a>
                </div>
                <div class="btn-group position-absolute bottom-0 start-0">
                    <button class="btn btn-dark dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Выход</a></li>
                        <li><a class="dropdown-item" href="#">Профиль</a></li>
                    </ul>
                </div>
            </div>
            </div>
        </div>
    </div>
    <div class="col-9 mt-5">
        <div class="row">
            <h1 class="display-2 text-center">Контакты</h1> <!-- Заголовок страница -->
            <div class="row mt-5">
                <div class="container overflow-hidden">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-5"> <!-- Карточка отправки почты -->
                            <div class="card">
                                <div class="card-body">
                                    <form>
                                        <div class="mb-3">
                                            <label for="exampleInputPassword1" class="form-label">Имя</label>
                                            <input type="text" class="form-control" id="exampleInputPassword1">
                                        </div>
                                        <label for="exampleInputEmail1" class="form-label">Почта</label>
                                        <div class="input-group mb-3">
                                            <span class="input-group-text" id="basic-addon1">@</span>
                                            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                                        </div>
                                        <div class="mb-3">
                                            <label for="exampleFormControlTextarea1" class="form-label">Сообщение</label>
                                            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary">Отправить</button> <!-- Кнопка отправки -->
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="col-1"></div>
                        <div class="col-5"> <!-- Карточка контактов сайта-->
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title mt-3">Наши контакты</h4>
                                    <p class="card-text mt-3 fst-italic">
                                        Здесь находится наша контактная информация о сайте.
                                        Также вы можете написать нам сообщение или оставить отзыв
                                        о нашей работе.
                                        Предложить какие-либо улучшения по работе сайта.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
